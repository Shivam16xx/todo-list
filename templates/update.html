    <div class="container">
        <h1>update your todo</h1>
        <form action="/update/{{todo.sno}}" method="POST">

            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Todo title</label>  
                <input type="text" class="form-control"  name="title" id="title" value="{{todo.title}}"aria-describedby="emailHelp">
                
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Todo description</label>
                <input type="text" class="form-control" name="desc" id="desc" value="{{todo.desc}}">
            </div>
         


            <button type="submit" class="btn btn-primary">update</button>
        </form>

    </div>
